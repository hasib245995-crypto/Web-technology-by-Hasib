<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab Task 03</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Box Model Demonstration</h1>

    <!-- Part A: Box Model -->
    <div class="box box1">Box 1 (Default Box Sizing)</div>
    <div class="box box2">Box 2 (Different Spacing)</div>
    <div class="box box3">Box 3 (border-box)</div>

    <hr>

    <!-- Part C: Display Properties -->
    <h2>Display Properties</h2>

    <div class="block">I am display: block</div>

    <span class="inline">I am inline</span>
    <span class="inline">Another inline element</span>

    <p class="inline-block">I am inline-block paragraph</p>

    <div class="hidden-display">This uses display: none</div>

    <div class="hidden-visibility">This uses visibility: hidden</div>

</body>
</html>
