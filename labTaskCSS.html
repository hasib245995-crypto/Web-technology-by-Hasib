<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Lab Task 01</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        /* Element selector */
        h1 {
            color: darkblue;
            font-family: Arial, sans-serif;
        }

        /* Class selector */
        .highlight {
            background-color: yellow;
            font-size: 18px;
        }

        /* ID selector */
        #mainTitle {
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Inline CSS -->
    <h1 id="mainTitle" style="color: red;">
        Welcome to CSS Lab
    </h1>

    <p>This paragraph is styled using the external stylesheet.</p>

    <p class="highlight">
        This paragraph uses a class selector with internal CSS.
    </p>

    <p>
        CSS helps control the presentation of web pages.
    </p>

</body>
</html>
